# ===== Настройки парсера вакансий =====

# Минимальная зарплата (руб/мес). Вакансии, где ВЕРХНЯЯ граница вилки ниже — отбрасываются.
# Если зарплата не указана — вакансия НЕ отбрасывается, её оценит DeepSeek.
min_salary_rub: 120000

# Вакансии старше N часов игнорируются (чтобы при первом запуске не прилетела сотня старых)
max_age_hours: 48

# Минимальная оценка DeepSeek (0-10), начиная с которой вакансия приходит в Telegram
min_score: 6

# Максимум сообщений за один запуск (защита от спама)
max_messages_per_run: 25

# Слова в НАЗВАНИИ вакансии (hh, Хабр) или в ТЕКСТЕ поста (Telegram), без которых вакансия даже не рассматривается
include_keywords:
  - qa
  - тестиров
  - test
  - quality assurance

# Если эти слова есть в названии — вакансия отбрасывается сразу, без DeepSeek
exclude_keywords:
  - стажер
  - стажёр
  - intern
  - разработчик
  - developer
  - аналитик данных
  - нагрузочн

sources:
  habr:
    enabled: true
    queries: ["QA", "тестировщик"]
    pages: 2               # по 25 вакансий на страницу
    remote_only: false     # false = удалёнка + гибрид + офис (офис потом отсеет DeepSeek)
  hh:
    enabled: true
    query: "QA OR тестировщик OR тестирование"
    work_formats: ["REMOTE", "HYBRID"]   # убери HYBRID, если гибрид не нужен
  telegram:
    enabled: true
    channels:              # публичные каналы, имя без @
      - jobforqa
      - qajoboffer
      - qajobsoffers
      - jobsearchgod
      - remoteeverafter

deepseek:
  # Ключ ProxyAPI лежит в секрете DEEPSEEK_API_KEY.
  # Для прямого API DeepSeek было бы: base_url "https://api.deepseek.com", model "deepseek-v4-flash"
  base_url: "https://api.proxyapi.ru/v1"
  # Модель из каталога proxyapi.ru/models/browse — менять только эту строку
  model: "deepseek/deepseek-v4-flash"
