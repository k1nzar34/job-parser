name: Парсер вакансий

on:
  schedule:
    - cron: "0 */3 * * *"   # каждые 3 часа (время в UTC)
  workflow_dispatch:         # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write            # чтобы сохранять seen.json обратно в репозиторий

concurrency:
  group: job-parser
  cancel-in-progress: false

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей
        run: pip install -r requirements.txt

      - name: Запуск парсера
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESUME_TEXT: ${{ secrets.RESUME_TEXT }}
        run: python main.py

      - name: Сохранить вакансии и список просмотренных
        run: |
          git config user.name "job-parser-bot"
          git config user.email "job-parser-bot@users.noreply.github.com"
          git add seen.json docs/vacancies.json
          git diff --cached --quiet || git commit -m "update vacancies [skip ci]"
          git push
